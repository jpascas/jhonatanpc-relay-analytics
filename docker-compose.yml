# Local development database only. The SA password is a dev-only value,
# repeated in backend/Relay.Api/appsettings.Development.json.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: relay-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Relay_Dev_Pass1!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - relay-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  relay-sqlserver-data:
