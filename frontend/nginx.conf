server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the SPA and the API: no CORS needed. The /api/... path is passed through unchanged.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback, so reloading a URL such as /?account=6 serves the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
